---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaletest-sa
  namespace: optimus-ide-collab-big
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scaletest-role
  namespace: optimus-ide-collab-big
rules:
  - apiGroups:
      - ""
    resources: ["*"]
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
      - deletecollection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaletest-rolebinding
  namespace: optimus-ide-collab-big
subjects:
  - kind: ServiceAccount
    name: scaletest-sa
roleRef:
  kind: Role
  name: scaletest-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: optimus-ide-collab-provisioner-podmonitor-rolebinding
  namespace: optimus-ide-collab-big
subjects:
  - kind: ServiceAccount
    name: optimus-ide-collab-provisioner
roleRef:
  kind: Role
  name: optimus-ide-collab-podmonitor
---

