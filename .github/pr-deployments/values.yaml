optimus-ide-collab:
  image:
    repo: "${REPO}"
    tag: "pr${PR_NUMBER}"
    pullPolicy: Always
  service:
    type: ClusterIP
  ingress:
    enable: true
    className: traefik
    host: "${PR_HOSTNAME}"
    wildcardHost: "*.${PR_HOSTNAME}"
    tls:
      enable: true
      secretName: "pr${PR_NUMBER}-tls"
      wildcardSecretName: "pr${PR_NUMBER}-tls"
  env:
    - name: "OPTIMUS-IDE-COLLAB_ACCESS_URL"
      value: "https://${PR_HOSTNAME}"
    - name: "OPTIMUS-IDE-COLLAB_WILDCARD_ACCESS_URL"
      value: "*.${PR_HOSTNAME}"
    - name: "OPTIMUS-IDE-COLLAB_EXPERIMENTS"
      value: "${EXPERIMENTS}"
    - name: OPTIMUS-IDE-COLLAB_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: optimus-ide-collab-db-url
          key: url
    - name: "OPTIMUS-IDE-COLLAB_OAUTH2_GITHUB_ALLOW_SIGNUPS"
      value: "true"
    - name: "OPTIMUS-IDE-COLLAB_OAUTH2_GITHUB_CLIENT_ID"
      value: "${PR_DEPLOYMENTS_GITHUB_OAUTH_CLIENT_ID}"
    - name: "OPTIMUS-IDE-COLLAB_OAUTH2_GITHUB_CLIENT_SECRET"
      value: "${PR_DEPLOYMENTS_GITHUB_OAUTH_CLIENT_SECRET}"
    - name: "OPTIMUS-IDE-COLLAB_OAUTH2_GITHUB_ALLOWED_ORGS"
      value: "optimus-ide-collab"
    - name: "OPTIMUS-IDE-COLLAB_DERP_CONFIG_URL"
      value: "https://controlplane.tailscale.com/derpmap/default"
