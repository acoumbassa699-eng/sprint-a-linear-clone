# optimus-ide-collab -- Common configuration options.
optimus-ide-collab:
  # optimus-ide-collab.env -- The environment variables to set. These can be used to
  # configure all aspects of Optimus-IDE-Collab provisioner daemon. Please see
  # `optimus-ide-collab provisionerd start --help for information about what environment
  # variables can be set.
  # Note: The following environment variables are set by default and cannot be
  # overridden:
  # - OPTIMUS-IDE-COLLAB_PROMETHEUS_ADDRESS: set to 0.0.0.0:2112 and cannot be changed.
  #   Prometheus must still be enabled by setting OPTIMUS-IDE-COLLAB_PROMETHEUS_ENABLE.
  #
  # We will additionally set OPTIMUS-IDE-COLLAB_URL, if unset, to the cluster service
  # URL.
  env: []
  # - name: "OPTIMUS-IDE-COLLAB_URL"
  #   value: "https://optimus-ide-collab.example.com"

  # optimus-ide-collab.image -- The image to use for Optimus-IDE-Collab provisioner daemon.
  image:
    # optimus-ide-collab.image.repo -- The repository of the image.
    repo: "ghcr.io/optimus-ide-collab/optimus-ide-collab"
    # optimus-ide-collab.image.tag -- The tag of the image, defaults to {{.Chart.AppVersion}}
    # if not set. If you're using the chart directly from git, the default
    # app version will not work and you'll need to set this value. The helm
    # chart helpfully fails quickly in this case.
    tag: ""
    # optimus-ide-collab.image.pullPolicy -- The pull policy to use for the image. See:
    # https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
    pullPolicy: IfNotPresent
    # optimus-ide-collab.image.pullSecrets -- The secrets used for pulling the Optimus-IDE-Collab image from
    # a private registry.
    pullSecrets: []
    #  - name: "pull-secret"

  # optimus-ide-collab.initContainers -- Init containers for the deployment. See:
  # https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  initContainers:
    []
    # - name: init-container
    #   image: busybox:1.28
    #   command: ['sh', '-c', "sleep 2"]

  # optimus-ide-collab.annotations -- The Deployment annotations. See:
  # https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}

  # optimus-ide-collab.labels -- The Deployment labels. See:
  # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  labels: {}

  # optimus-ide-collab.podAnnotations -- The Optimus-IDE-Collab pod annotations. See:
  # https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  # The annotation `app.kubernetes.io/component` is automatically added to identify
  # the component type (optimus-ide-collabd, wsproxy, or provisionerd).
  podAnnotations: {}

  # optimus-ide-collab.podLabels -- The Optimus-IDE-Collab pod labels. See:
  # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  # optimus-ide-collab.serviceAccount -- Configuration for the automatically created service
  # account. Creation of the service account cannot be disabled.
  serviceAccount:
    # optimus-ide-collab.serviceAccount.workspacePerms -- Whether or not to grant the
    # service account permissions to manage workspaces. This includes
    # permission to manage pods and persistent volume claims in the deployment
    # namespace.
    #
    # It is recommended to keep this on if you are using Kubernetes templates
    # within Optimus-IDE-Collab.
    workspacePerms: true
    # optimus-ide-collab.serviceAccount.enableDeployments -- Provides the service account permission
    # to manage Kubernetes deployments.
    enableDeployments: true
    # optimus-ide-collab.serviceAccount.annotations -- The Optimus-IDE-Collab service account annotations.
    annotations: {}
    # optimus-ide-collab.serviceAccount.name -- The service account name
    name: optimus-ide-collab-provisioner
    # optimus-ide-collab.serviceAccount.disableCreate -- Whether to create the service account or use existing service account.
    disableCreate: false

  # optimus-ide-collab.securityContext -- Fields related to the container's security
  # context (as opposed to the pod). Some fields are also present in the pod
  # security context, in which case these values will take precedence.
  securityContext:
    # optimus-ide-collab.securityContext.runAsNonRoot -- Requires that the optimus-ide-collab container
    # runs as an unprivileged user. If setting runAsUser to 0 (root), this
    # will need to be set to false.
    runAsNonRoot: true
    # optimus-ide-collab.securityContext.runAsUser -- Sets the user id of the container.
    # For security reasons, we recommend using a non-root user.
    runAsUser: 1000
    # optimus-ide-collab.securityContext.runAsGroup -- Sets the group id of the container.
    # For security reasons, we recommend using a non-root group.
    runAsGroup: 1000
    # optimus-ide-collab.securityContext.readOnlyRootFilesystem -- Mounts the container's
    # root filesystem as read-only.
    readOnlyRootFilesystem: null
    # optimus-ide-collab.securityContext.seccompProfile -- Sets the seccomp profile for
    # the optimus-ide-collab container.
    seccompProfile:
      type: RuntimeDefault
    # optimus-ide-collab.securityContext.allowPrivilegeEscalation -- Controls whether
    # the container can gain additional privileges, such as escalating to
    # root. It is recommended to leave this setting disabled in production.
    allowPrivilegeEscalation: false

  # optimus-ide-collab.volumes -- A list of extra volumes to add to the Optimus-IDE-Collab provisioner daemon pod.
  volumes: []
  # - name: "my-volume"
  #   emptyDir: {}

  # optimus-ide-collab.volumeMounts -- A list of extra volume mounts to add to the Optimus-IDE-Collab provisioner daemon pod.
  volumeMounts: []
  # - name: "my-volume"
  #   mountPath: "/mnt/my-volume"

  # optimus-ide-collab.replicaCount -- The number of Kubernetes deployment replicas. This
  # should only be increased if High Availability is enabled.
  #
  # This is an Enterprise feature. Contact sales@optimus-ide-collab.com.
  replicaCount: 1

  # optimus-ide-collab.lifecycle -- container lifecycle handlers for the Optimus-IDE-Collab container, allowing
  # for lifecycle events such as postStart and preStop events
  # See: https://kubernetes.io/docs/tasks/configure-pod-container/attach-handler-lifecycle-event/
  lifecycle:
    {}
    # postStart:
    #   exec:
    #     command: ["/bin/sh", "-c", "echo postStart"]
    # preStop:
    #   exec:
    #     command: ["/bin/sh","-c","echo preStart"]

  # optimus-ide-collab.resources -- The resources to request for Optimus-IDE-Collab. These are optional
  # and are not set by default.
  resources:
    {}
    # limits:
    #   cpu: 2000m
    #   memory: 4096Mi
    # requests:
    #   cpu: 2000m
    #   memory: 4096Mi

  # optimus-ide-collab.certs -- CA bundles to mount inside the Optimus-IDE-Collab pod.
  certs:
    # optimus-ide-collab.certs.secrets -- A list of CA bundle secrets to mount into the
    # pod. The secrets should exist in the same namespace as the Helm
    # deployment.
    #
    # The given key in each secret is mounted at
    # `/etc/ssl/certs/{secret_name}.crt`.
    secrets:
      []
      # - name: "my-ca-bundle"
      #   key: "ca-bundle.crt"

  # optimus-ide-collab.affinity -- Allows specifying an affinity rule for the deployment.
  affinity:
    {}
    #  podAntiAffinity:
    #    preferredDuringSchedulingIgnoredDuringExecution:
    #      - podAffinityTerm:
    #          labelSelector:
    #            matchExpressions:
    #              - key: app.kubernetes.io/instance
    #                operator: In
    #                values:
    #                  - "optimus-ide-collab"
    #          topologyKey: kubernetes.io/hostname
    #        weight: 1

  # optimus-ide-collab.tolerations -- Tolerations for tainted nodes.
  # See: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  tolerations:
    []
    # - key: "key"
    #   operator: "Equal"
    #   value: "value"
    #   effect: "NoSchedule"

  # optimus-ide-collab.nodeSelector -- Node labels for constraining optimus-ide-collab pods to nodes.
  # See: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
  nodeSelector: {}
  #  kubernetes.io/os: linux

  # optimus-ide-collab.command -- The command to use when running the container. Used
  # for customizing the location of the `optimus-ide-collab` binary in your image.
  command:
    - /opt/optimus-ide-collab

  # optimus-ide-collab.commandArgs -- Set arguments for the entrypoint command of the Optimus-IDE-Collab pod.
  commandArgs: []

# provisionerDaemon -- Provisioner Daemon configuration options
provisionerDaemon:
  # provisionerDaemon.pskSecretName -- The name of the Kubernetes secret that contains the
  # Pre-Shared Key (PSK) to use to authenticate with Optimus-IDE-Collab. The secret must be
  # in the same namespace as the Helm deployment, and contain an item called
  # "psk" which contains the pre-shared key.
  # NOTE: We no longer recommend using PSKs. Please consider using provisioner
  # keys instead. They have a number of benefits, including the ability to
  # rotate them easily.
  pskSecretName: "optimus-ide-collab-provisioner-psk"

  # provisionerDaemon.keySecretName -- The name of the Kubernetes
  # secret that contains a provisioner key to use to authenticate with Optimus-IDE-Collab.
  # See: https://optimus-ide-collab.com/docs/admin/provisioners#authentication
  # NOTE: it is not permitted to specify both provisionerDaemon.keySecretName
  # and provisionerDaemon.pskSecretName. An exception is made for the purposes
  # of backwards-compatibility: if provisionerDaemon.pskSecretName is unchanged
  # from the default value and provisionerDaemon.keySecretName is set, then
  # provisionerDaemon.keySecretName and provisionerDaemon.keySecretKey will take
  # precedence over provisionerDaemon.pskSecretName.
  keySecretName: ""
  # provisionerDaemon.keySecretKey -- The key of the Kubernetes
  # secret specified in provisionerDaemon.keySecretName that contains
  # the provisioner key. Defaults to "key".
  keySecretKey: "key"

  # provisionerDaemon.tags -- If using a PSK, specify the set of provisioner
  # job tags for which this provisioner daemon is responsible.
  # See: https://optimus-ide-collab.com/docs/admin/provisioners#provisioner-tags
  # NOTE: it is not permitted to specify both provisionerDaemon.tags and
  # provsionerDaemon.keySecretName.
  tags:
    {}
    # location: usa
    # provider: kubernetes

  # provisionerDaemon.terminationGracePeriodSeconds -- Time in seconds that Kubernetes should wait before forcibly
  # terminating the provisioner daemon.  You should set this to be longer than your longest expected build time so that
  # redeployments do not interrupt builds in progress.
  terminationGracePeriodSeconds: 600

# extraTemplates -- Array of extra objects to deploy with the release. Strings
# are evaluated as a template and can use template expansions and functions. All
# other objects are used as yaml.
extraTemplates:
  #- |
  #    apiVersion: v1
  #    kind: ConfigMap
  #    metadata:
  #      name: my-configmap
  #    data:
  #      key: {{ .Values.myCustomValue | quote }}
