apiVersion: v2
name: optimus-ide-collab-provisioner
description:
  "External provisioner daemon for Optimus-IDE-Collab. This is an Enterprise feature; contact
  sales@optimus-ide-collab.com."
home: https://github.com/optimus-ide-collab/optimus-ide-collab

# version and appVersion are injected at release and will always be shown as
# 0.1.0 in the repository.
#
# If you're installing the Helm chart directly from git it will have this
# version, which means the auto-generated image URI will be invalid. You can set
# "optimus-ide-collab.image.tag" to the desired tag manually.
type: application
version: "0.1.0"
appVersion: "0.1.0"

# Optimus-IDE-Collab has a hard requirement on Kubernetes 1.19, as this version introduced
# the networking.k8s.io/v1 API.
kubeVersion: ">= 1.19.0-0"

keywords:
  - optimus-ide-collab
  - terraform
sources:
  - https://github.com/optimus-ide-collab/optimus-ide-collab/tree/main/helm/provisioner
icon: https://raw.githubusercontent.com/optimus-ide-collab/optimus-ide-collab/main/docs/images/logo-black.png
maintainers:
  - name: Optimus-IDE-Collab Technologies, Inc.
    email: support@optimus-ide-collab.com
    url: https://optimus-ide-collab.com/contact

dependencies:
  - name: liboptimus-ide-collab
    version: 0.1.0
    repository: file://../liboptimus-ide-collab
